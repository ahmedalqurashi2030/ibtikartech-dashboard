name: Production Section Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on:
      - self-hosted
      - production
      - ibtikartech
    timeout-minutes: 5

    steps:
      - name: Compare source main with production homepage
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/ibtikar-source-index.html
          PROD=/tmp/ibtikar-prod-index.html

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/ahmedalqurashi2030/ibtikartech/main/index.html \
            -o "$SRC"

          curl --fail --silent --show-error \
            --resolve 'ibtikartech.co:443:127.0.0.1' \
            https://ibtikartech.co/ \
            -o "$PROD"

          python3 - "$SRC" "$PROD" <<'PY'
          import sys, html, hashlib
          from html.parser import HTMLParser

          REGION_IDS={'ibtikarSiteHeader':'header','ibtikarMobileMenu':'mobile_nav','home':'home','journey':'journey','services':'services','tharaa':'tharaa','faq':'faq','contact':'contact'}

          class AuditParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.region_stack=[]
                  self.current=None
                  self.data={k:{'text':[],'links':[],'images':[]} for k in [*REGION_IDS.values(),'footer']}
                  self.styles=[]; self.scripts=[]
              def norm(self,v):
                  if not v: return ''
                  v=v.replace('/static/public_preview/','')
                  return v.lstrip('/') if v.startswith('/assets/') else v
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  prev=self.current
                  if d.get('id') in REGION_IDS:
                      self.region_stack.append(prev); self.current=REGION_IDS[d['id']]
                  elif tag=='footer':
                      self.region_stack.append(prev); self.current='footer'
                  if self.current:
                      if tag=='a' and d.get('href'): self.data[self.current]['links'].append(self.norm(d.get('href')))
                      if tag=='img' and d.get('src'): self.data[self.current]['images'].append(self.norm(d.get('src')))
                  rel=d.get('rel','')
                  if tag=='link' and 'stylesheet' in rel and d.get('href'): self.styles.append(self.norm(d['href']))
                  if tag=='script' and d.get('src'): self.scripts.append(self.norm(d['src']))
              def handle_data(self, data):
                  if self.current:
                      t=' '.join(data.split())
                      if t: self.data[self.current]['text'].append(t)
              def handle_endtag(self, tag):
                  if tag in ('header','nav','section','footer') and self.region_stack:
                      self.current=self.region_stack.pop()

          def parse(path):
              p=AuditParser()
              with open(path,encoding='utf-8',errors='replace') as f: p.feed(f.read())
              return p

          def digest_text(items):
              return hashlib.sha256('\n'.join(items).encode()).hexdigest()[:12]

          src=parse(sys.argv[1]); prod=parse(sys.argv[2])
          print('--- REGION AUDIT ---')
          for region in ['header','mobile_nav','home','journey','services','tharaa','faq','contact','footer']:
              a=src.data[region]; b=prod.data[region]
              print(f'{region}|text_equal={a["text"]==b["text"]}|links_equal={a["links"]==b["links"]}|images_equal={a["images"]==b["images"]}|src_text_sha={digest_text(a["text"])}|prod_text_sha={digest_text(b["text"])}|links={len(a["links"])}/{len(b["links"])}|images={len(a["images"])}/{len(b["images"])}')
              if a['links']!=b['links']:
                  print('SRC_LINKS',region,a['links']); print('PROD_LINKS',region,b['links'])
              if a['images']!=b['images']:
                  print('SRC_IMAGES',region,a['images']); print('PROD_IMAGES',region,b['images'])
          print('STYLES_EQUAL',src.styles==prod.styles)
          print('SOURCE_STYLES',src.styles)
          print('PROD_STYLES',prod.styles)
          print('SCRIPTS_EQUAL',src.scripts==prod.scripts)
          print('SOURCE_SCRIPTS',src.scripts)
          print('PROD_SCRIPTS',prod.scripts)

          with open('/tmp/ibtikar-assets.list','w',encoding='utf-8') as f:
              for x in src.styles+src.scripts:
                  if x.startswith('assets/'): f.write(x+'\n')
          PY

          echo '--- ASSET BYTE AUDIT ---'
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            src_file="/tmp/src-$(echo "$asset" | tr '/.' '__')"
            prod_file="/tmp/prod-$(echo "$asset" | tr '/.' '__')"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/ahmedalqurashi2030/ibtikartech/main/$asset" \
              -o "$src_file"
            curl --fail --silent --show-error \
              --resolve 'ibtikartech.co:443:127.0.0.1' \
              "https://ibtikartech.co/static/public_preview/$asset" \
              -o "$prod_file"
            s1=$(sha256sum "$src_file" | awk '{print $1}')
            s2=$(sha256sum "$prod_file" | awk '{print $1}')
            if [ "$s1" = "$s2" ]; then status=MATCH; else status=DIFF; fi
            echo "$status|$asset|$s1|$s2"
          done < /tmp/ibtikar-assets.list
