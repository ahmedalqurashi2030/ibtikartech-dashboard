name: Self-hosted Runner Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/self-hosted-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - production
      - ibtikartech
    timeout-minutes: 8

    steps:
      - name: Verify runner baseline without changing the server
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner labels matched: self-hosted / production / ibtikartech"
          echo "Kernel: $(uname -srm)"
          echo "Architecture: $(uname -m)"
          echo "Disk:"
          df -h / | tail -n 1
          echo "Memory:"
          free -h | sed -n '1,2p'
          command -v git
          git --version
          command -v python3
          python3 --version
          command -v curl
          curl --version | head -n 1

      - name: Setup Python 3.12 in runner tool cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v python
          python --version
          python -m pip --version

      - name: Setup Node 24 in runner tool cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          node --version
          command -v npm
          npm --version

      - name: Download pinned Chrome Headless Shell without sudo
        id: headless-shell
        shell: bash
        run: |
          set -euo pipefail
          chrome_version="152.0.7977.54"
          archive="$RUNNER_TEMP/chrome-headless-shell.zip"
          install_dir="$RUNNER_TEMP/chrome-headless-shell"
          rm -rf "$install_dir" "$archive"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://storage.googleapis.com/chrome-for-testing-public/${chrome_version}/linux64/chrome-headless-shell-linux64.zip" \
            -o "$archive"
          python - "$archive" "$install_dir" <<'PY'
          import os
          import sys
          import zipfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
              for info in bundle.infolist():
                  mode = (info.external_attr >> 16) & 0o7777
                  if not mode or info.is_dir():
                      continue
                  target = destination / info.filename
                  if target.exists() and not target.is_symlink():
                      os.chmod(target, mode)
          PY
          chrome_path="$(find "$install_dir" -type f -name 'chrome-headless-shell' -print -quit)"
          test -n "$chrome_path"
          test -x "$chrome_path"
          echo "chrome-path=$chrome_path" >> "$GITHUB_OUTPUT"
          echo "Pinned headless shell extracted to runner temp."

      - name: Verify headless shell runtime dependencies
        env:
          CHROME_PATH: ${{ steps.headless-shell.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          ldd "$CHROME_PATH" | tee "$RUNNER_TEMP/ibtikar-headless-ldd.txt"
          if grep -q 'not found' "$RUNNER_TEMP/ibtikar-headless-ldd.txt"; then
            echo "Missing shared libraries detected; refusing to modify the production host."
            exit 1
          fi
          "$CHROME_PATH" --version

      - name: Verify headless shell can launch CDP
        env:
          CHROME_PATH: ${{ steps.headless-shell.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          profile="$RUNNER_TEMP/ibtikar-headless-profile"
          rm -rf "$profile"
          "$CHROME_PATH" \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --remote-debugging-port=9555 \
            --user-data-dir="$profile" \
            about:blank > "$RUNNER_TEMP/ibtikar-headless.log" 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            rm -rf "$profile"
          }
          trap cleanup EXIT
          for i in {1..50}; do
            if curl --fail --silent http://127.0.0.1:9555/json/version > "$RUNNER_TEMP/ibtikar-headless-version.json"; then
              python - <<'PY'
          import json
          import os
          from pathlib import Path
          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'ibtikar-headless-version.json').read_text())
          assert payload.get('webSocketDebuggerUrl'), payload
          print(payload.get('Browser', 'Headless shell CDP ready'))
          PY
              echo "Chrome Headless Shell CDP launch succeeded."
              exit 0
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/ibtikar-headless.log"
          exit 1

      - name: Confirm no privileged system change was required
        shell: bash
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo "passwordless_sudo=yes"
          else
            echo "passwordless_sudo=no"
          fi
          echo "Preflight completed using runner/user-space tool caches only."
