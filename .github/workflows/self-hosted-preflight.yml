name: Self-hosted Runner Preflight

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/self-hosted-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - production
      - ibtikartech
    timeout-minutes: 8

    steps:
      - name: Verify runner baseline without changing the server
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner labels matched: self-hosted / production / ibtikartech"
          echo "Kernel: $(uname -srm)"
          echo "Architecture: $(uname -m)"
          echo "Disk:"
          df -h / | tail -n 1
          echo "Memory:"
          free -h | sed -n '1,2p'
          command -v git
          git --version
          command -v python3
          python3 --version
          command -v curl
          curl --version | head -n 1

      - name: Setup Python 3.12 in runner tool cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v python
          python --version
          python -m pip --version

      - name: Setup Node 24 in runner tool cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Node toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v node
          node --version
          command -v npm
          npm --version

      - name: Provide user-space unzip shim for Chrome action
        shell: bash
        run: |
          set -euo pipefail
          shim_dir="$RUNNER_TEMP/ibtikar-user-bin"
          mkdir -p "$shim_dir"
          cat > "$shim_dir/unzip" <<'PY'
          #!/usr/bin/env python
          import os
          import stat
          import sys
          import zipfile
          from pathlib import Path

          args = sys.argv[1:]
          archive = None
          destination = Path('.')
          index = 0
          while index < len(args):
              arg = args[index]
              if arg == '-d':
                  index += 1
                  if index >= len(args):
                      raise SystemExit('unzip shim: -d requires a destination')
                  destination = Path(args[index])
              elif arg.startswith('-'):
                  pass
              elif archive is None:
                  archive = Path(arg)
              index += 1

          if archive is None:
              raise SystemExit('unzip shim: archive path is required')

          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as bundle:
              bundle.extractall(destination)
              for info in bundle.infolist():
                  mode = (info.external_attr >> 16) & 0o7777
                  if not mode or info.is_dir():
                      continue
                  target = destination / info.filename
                  if target.exists() and not target.is_symlink():
                      os.chmod(target, mode)
          PY
          chmod 0755 "$shim_dir/unzip"
          echo "$shim_dir" >> "$GITHUB_PATH"
          "$shim_dir/unzip" --help >/dev/null 2>&1 || true

      - name: Setup Chrome for Testing without sudo
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          no-sudo: true

      - name: Verify Chrome can launch headless
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHROME_PATH"
          test -x "$CHROME_PATH"
          "$CHROME_PATH" --version
          timeout 30s "$CHROME_PATH" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --dump-dom about:blank > /tmp/ibtikar-chrome-preflight.html
          test -s /tmp/ibtikar-chrome-preflight.html
          rm -f /tmp/ibtikar-chrome-preflight.html
          echo "Chrome headless launch succeeded."

      - name: Confirm no privileged system change was required
        shell: bash
        run: |
          set -euo pipefail
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo "passwordless_sudo=yes"
          else
            echo "passwordless_sudo=no"
          fi
          echo "Preflight completed using runner/user-space tool caches only."
