name: Patch Related Cards QA Lazy Image Check

on:
  push:
    branches:
      - qa/related-service-cards-20260821

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/related-service-cards-20260821
      - name: Scroll carousel into view before checking lazy images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/qa_related_service_cards.cjs')
          text = path.read_text(encoding='utf-8')
          old = """  await client.send('Page.navigate', { url: `${baseUrl}${route}` });\n  await wait(900);\n\n  const metrics = await evaluate(client, `(() => {"""
          new = """  await client.send('Page.navigate', { url: `${baseUrl}${route}` });\n  await wait(900);\n  await evaluate(client, `(() => {\n    const related = document.querySelector('.service-related-cards, .service-related-grid, .related-nav');\n    related?.scrollIntoView({ block: 'center', inline: 'nearest' });\n    return Boolean(related);\n  })()`);\n  await wait(500);\n\n  const metrics = await evaluate(client, `(() => {"""
          if new not in text:
              if old not in text:
                  raise SystemExit('QA navigation anchor changed; refusing edit')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/qa_related_service_cards.cjs
      - name: Commit QA-only patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/qa_related_service_cards.cjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: scroll related cards into view before lazy image checks'
          git push origin HEAD:qa/related-service-cards-20260821
