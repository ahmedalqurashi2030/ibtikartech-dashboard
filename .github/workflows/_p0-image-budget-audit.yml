name: P0 one-time extract inline hero images

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_p0-image-budget-audit.yml"

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production, ibtikartech]
    timeout-minutes: 5
    steps:
      - name: Checkout performance branch
        uses: actions/checkout@v4
        with:
          ref: perf/p0-dashboard-image-budget
          fetch-depth: 0

      - name: Verify byte identity and replace inline images
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import re
          from pathlib import Path

          GROUPS = {
              'services': {
                  'asset': Path('static/public_preview/assets/images/hero/ibtikar-services-ecosystem-v1.jpg'),
                  'public': '/static/public_preview/assets/images/hero/ibtikar-services-ecosystem-v1.jpg',
                  'mime': 'jpeg',
                  'templates': [
                      Path('templates/public_preview/pages/growth.html'),
                      Path('templates/public_preview/pages/custom-systems.html'),
                      Path('templates/public_preview/pages/services.html'),
                  ],
              },
              'ecommerce': {
                  'asset': Path('static/public_preview/assets/images/hero/ibtikar-ecommerce-journey-v1.jpg'),
                  'public': '/static/public_preview/assets/images/hero/ibtikar-ecommerce-journey-v1.jpg',
                  'mime': 'jpeg',
                  'templates': [
                      Path('templates/public_preview/pages/ecommerce-growth.html'),
                      Path('templates/public_preview/pages/storefront-customization.html'),
                      Path('templates/public_preview/pages/ecommerce.html'),
                      Path('templates/public_preview/pages/ecommerce-support.html'),
                      Path('templates/public_preview/pages/product-page-optimization.html'),
                      Path('templates/public_preview/pages/store-launch.html'),
                      Path('templates/public_preview/pages/store-redesign.html'),
                  ],
              },
              'home': {
                  'asset': Path('static/public_preview/assets/images/hero/ibtikar-connected-ecosystem-v1.webp'),
                  'public': '/static/public_preview/assets/images/hero/ibtikar-connected-ecosystem-v1.webp',
                  'mime': 'webp',
                  'templates': [Path('templates/public_preview/pages/index.html')],
              },
          }

          DATA_URI = re.compile(
              r'data:image/(?P<mime>[A-Za-z0-9.+-]+);base64,(?P<payload>[A-Za-z0-9+/=]+)'
          )

          before_total = 0
          after_total = 0
          replaced = 0
          decoded_shas = {}

          for group_name, group in GROUPS.items():
              asset_path = group['asset']
              if not asset_path.is_file():
                  raise SystemExit(f'Missing expected hero asset: {asset_path}')
              asset_bytes = asset_path.read_bytes()
              asset_sha = hashlib.sha256(asset_bytes).hexdigest()
              group_shas = set()

              for template_path in group['templates']:
                  source = template_path.read_text(encoding='utf-8')
                  matches = list(DATA_URI.finditer(source))
                  if len(matches) != 1:
                      raise SystemExit(
                          f'Expected exactly one inline image in {template_path}, found {len(matches)}'
                      )

                  match = matches[0]
                  mime = match.group('mime').lower()
                  if mime != group['mime']:
                      raise SystemExit(
                          f'Unexpected MIME in {template_path}: {mime}; expected {group["mime"]}'
                      )

                  try:
                      decoded = base64.b64decode(match.group('payload'), validate=True)
                  except Exception as exc:
                      raise SystemExit(f'Invalid base64 in {template_path}: {exc}') from exc

                  decoded_sha = hashlib.sha256(decoded).hexdigest()
                  group_shas.add(decoded_sha)
                  if decoded != asset_bytes:
                      raise SystemExit(
                          f'Byte mismatch: {template_path} inline sha={decoded_sha[:12]} '
                          f'!= {asset_path} sha={asset_sha[:12]}'
                      )

                  before_total += len(source.encode('utf-8'))
                  updated = source[:match.start()] + group['public'] + source[match.end():]
                  after_total += len(updated.encode('utf-8'))
                  template_path.write_text(updated, encoding='utf-8')
                  replaced += 1

              if group_shas != {asset_sha}:
                  raise SystemExit(
                      f'Group {group_name} did not collapse to one exact asset sha: {group_shas}'
                  )
              decoded_shas[group_name] = asset_sha
              print(
                  f'{group_name}: templates={len(group["templates"])} '
                  f'asset_bytes={len(asset_bytes)} sha256={asset_sha}'
              )

          expected_replacements = sum(len(group['templates']) for group in GROUPS.values())
          if replaced != expected_replacements or replaced != 11:
              raise SystemExit(
                  f'Expected 11 replacements, completed {replaced} '
                  f'(configured={expected_replacements})'
              )

          remaining = []
          for path in Path('templates/public_preview').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'data:image/' in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'Inline data images remain in templates: {remaining}')

          saved = before_total - after_total
          if saved < 2_000_000:
              raise SystemExit(f'Unexpectedly small HTML reduction: {saved} bytes')

          print(f'replaced={replaced}')
          print(f'html_before_bytes={before_total}')
          print(f'html_after_bytes={after_total}')
          print(f'html_bytes_removed={saved} ({saved / 1024 / 1024:.2f} MiB)')
          for name, sha in decoded_shas.items():
              print(f'{name}_sha256={sha}')
          PY

          ! grep -R --include='*.html' -n 'data:image/' templates/public_preview
          git diff --check

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_p0-image-budget-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/public_preview/pages .github/workflows/_p0-image-budget-audit.yml
          git diff --cached --check
          git commit -m "perf: extract shared inline hero images"
          git push origin HEAD:perf/p0-dashboard-image-budget
