name: Production Diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on:
      - self-hosted
      - production
      - ibtikartech
    timeout-minutes: 5

    steps:
      - name: Read-only production diagnostics
        shell: bash
        run: |
          set +e

          echo "=== runner ==="
          date -u
          hostname

          echo "=== relevant services ==="
          systemctl list-units --type=service --all --no-pager \
            | grep -Ei 'ibtikar|gunicorn|nginx' || true

          echo "=== health ==="
          curl --max-time 10 --silent --show-error --include --insecure \
            -H 'Host: ibtikartech.co' https://127.0.0.1/healthz/ || true
          curl --max-time 15 --silent --show-error --include \
            https://ibtikartech.co/healthz/ || true

          echo "=== public route status ==="
          for route in \
            / \
            /services.html \
            /ecommerce.html \
            /websites.html \
            /brand-content.html \
            /growth.html \
            /custom-systems.html \
            /tharaa.html \
            /portfolio.html \
            /knowledge.html \
            /about.html \
            /contact.html; do
            code="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' "https://ibtikartech.co${route}" || printf '000')"
            printf '%s %s\n' "$code" "$route"
          done

          echo "=== production-served refinement assets ==="
          failed=0
          for asset in \
            /static/public_preview/assets/css/pages/article-utility-completion-v1.css \
            /static/public_preview/assets/css/pages/article-utility-refinement-v1.css \
            /static/public_preview/assets/css/pages/ecommerce-refinement-v1.css \
            /static/public_preview/assets/css/pages/homepage-production-qa-v1.css \
            /static/public_preview/assets/css/pages/homepage-refinement-v1.css \
            /static/public_preview/assets/css/pages/public-pages-completion-v1.css \
            /static/public_preview/assets/css/pages/public-pages-refinement-v1.css \
            /static/public_preview/assets/css/pages/service-category-refinement-v1.css \
            /static/public_preview/assets/css/pages/service-detail-completion-v1.css \
            /static/public_preview/assets/css/pages/service-detail-refinement-v1.css \
            /static/public_preview/assets/css/pages/services-refinement-v1.css \
            /static/public_preview/assets/css/pages/tharaa-refinement-v1.css; do
            code="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' "https://ibtikartech.co${asset}" || printf '000')"
            printf '%s %s\n' "$code" "$asset"
            if [ "$code" != "200" ]; then failed=1; fi
          done

          echo "=== deployed page-shell loaders ==="
          shell_js="$(curl --max-time 15 --silent --show-error https://ibtikartech.co/static/public_preview/assets/js/page-shell.js || true)"
          if printf '%s' "$shell_js" | grep -q "const productionOrigin = 'https://ibtikartech.co'"; then
            echo "PASS production metadata marker"
          else
            echo "FAIL production metadata marker"
            failed=1
          fi
          if printf '%s' "$shell_js" | grep -q "/static/public_preview/assets/css/pages/service-category-refinement-v1.css"; then
            echo "PASS served refinement loader marker"
          else
            echo "FAIL served refinement loader marker"
            failed=1
          fi
          if printf '%s' "$shell_js" | grep -q "/static/public_preview/dashboard/"; then
            echo "FAIL legacy dashboard static path still loaded"
            failed=1
          else
            echo "PASS no legacy dashboard static loader path"
          fi

          echo "=== legacy inaccessible path (informational) ==="
          legacy_code="$(curl --max-time 15 --silent --show-error --output /dev/null --write-out '%{http_code}' https://ibtikartech.co/static/public_preview/dashboard/homepage-refinement-v1.css || printf '000')"
          echo "$legacy_code /static/public_preview/dashboard/homepage-refinement-v1.css"

          if [ "$failed" -ne 0 ]; then
            echo "PRODUCTION REFINEMENT DELIVERY CHECK FAILED"
            exit 1
          fi
          echo "PRODUCTION REFINEMENT DELIVERY CHECK PASSED"
