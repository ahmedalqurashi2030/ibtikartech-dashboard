name: Frontend Refinement Import QA

on:
  pull_request:
    paths:
      - "scripts/import_frontend_preview.py"
      - "scripts/refactor_public_preview_templates.py"
      - "scripts/normalize_public_preview_metadata.py"
      - "scripts/patch_public_runtime_accessibility.py"
      - "scripts/verify_django_template_contract.py"
      - "scripts/verify_public_section_preservation.py"
      - "templates/public_preview/base.html"
      - "templates/public_preview/pages/product-page-optimization.html"
      - "static/public_preview/assets/js/page-shell.js"
      - "static/public_preview/assets/css/pages/*-v1.css"
      - "static/public_preview/dashboard/*.css"
      - ".github/workflows/frontend-refinement-import-qa.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/import_frontend_preview.py"
      - "scripts/refactor_public_preview_templates.py"
      - "scripts/normalize_public_preview_metadata.py"
      - "scripts/patch_public_runtime_accessibility.py"
      - "scripts/verify_django_template_contract.py"
      - "scripts/verify_public_section_preservation.py"
      - "templates/public_preview/base.html"
      - "templates/public_preview/pages/product-page-optimization.html"
      - "static/public_preview/assets/js/page-shell.js"
      - "static/public_preview/assets/css/pages/*-v1.css"
      - "static/public_preview/dashboard/*.css"
      - ".github/workflows/frontend-refinement-import-qa.yml"

permissions:
  contents: read

jobs:
  importer-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate import and transformation scripts
        run: |
          python -m py_compile scripts/import_frontend_preview.py
          python -m py_compile scripts/refactor_public_preview_templates.py
          python -m py_compile scripts/normalize_public_preview_metadata.py
          python -m py_compile scripts/patch_public_runtime_accessibility.py
          python -m py_compile scripts/verify_django_template_contract.py
          python -m py_compile scripts/verify_public_section_preservation.py

      - name: Verify committed refinement mirror
        shell: bash
        run: |
          set -euo pipefail
          for source in static/public_preview/dashboard/*.css; do
            filename="$(basename "$source")"
            target="static/public_preview/assets/css/pages/$filename"
            test -f "$target"
            cmp --silent "$source" "$target"
          done

      - name: Checkout current frontend source
        run: git clone --depth 1 https://github.com/ahmedalqurashi2030/ibtikartech.git /tmp/ibtikartech-source

      - name: Verify frontend owns canonical related-service assets
        shell: bash
        run: |
          set -euo pipefail
          related_js=/tmp/ibtikartech-source/assets/js/service-related-cards.js
          related_css=/tmp/ibtikartech-source/assets/css/pages/service-related-cards.css
          test -f "$related_js"
          test -f "$related_css"
          grep -q "const relatedSelectors" "$related_js"
          grep -q "document.querySelector(relatedSelectors)" "$related_js"
          ! grep -q "categoryPages" "$related_js"
          ! grep -q "body.dataset.page" "$related_js"

      - name: Preserve standardized inline service page contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ibtikar-inline-contracts
          cp templates/public_preview/pages/product-page-optimization.html \
            /tmp/ibtikar-inline-contracts/product-page-optimization.html

      - name: Run real frontend importer
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git -C /tmp/ibtikartech-source rev-parse HEAD)"
          python scripts/import_frontend_preview.py \
            --source /tmp/ibtikartech-source \
            --destination "$GITHUB_WORKSPACE" \
            --source-commit "$source_commit"

      - name: Verify related-service assets survive real import
        shell: bash
        run: |
          set -euo pipefail
          imported_js=static/public_preview/assets/js/service-related-cards.js
          imported_css=static/public_preview/assets/css/pages/service-related-cards.css
          test -f "$imported_js"
          test -f "$imported_css"
          grep -q "const relatedSelectors" "$imported_js"
          grep -q "/static/public_preview/assets/images/" "$imported_js"
          ! grep -q "body.dataset.page" "$imported_js"

      - name: Restore standardized inline service page contract
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/ibtikar-inline-contracts/product-page-optimization.html \
            templates/public_preview/pages/product-page-optimization.html

      - name: Apply native Django public template architecture
        run: |
          python scripts/refactor_public_preview_templates.py
          python scripts/normalize_public_preview_metadata.py
          python scripts/patch_public_runtime_accessibility.py

      - name: Verify native Django template contract
        run: python scripts/verify_django_template_contract.py

      - name: Verify every approved section and content block survives import
        run: python scripts/verify_public_section_preservation.py --source /tmp/ibtikartech-source

      - name: Verify import-safe Django and production paths
        shell: bash
        run: |
          set -euo pipefail
          for page in templates/public_preview/pages/*.html; do
            grep -q 'extends "public_preview/base.html"' "$page"
            test "$(grep -c '{% block body %}' "$page")" -eq 1
            ! grep -q '{% block content %}' "$page"
            ! grep -q '{% block page_scripts %}' "$page"
            ! grep -q 'page_scripts' "$page"
            ! grep -q 'id="ibtikarSiteHeader"' "$page"
            ! grep -q 'class="ibt-shell-footer"' "$page"
            ! grep -q 'public_preview/components/' "$page"
            ! grep -q '{% include ' "$page"
          done
          ! grep -R -n -E 'href="[^" ]+\.html([?#][^"]*)?"|action="[^" ]+\.html([?#][^"]*)?"' templates/public_preview/pages
          ! grep -R -n 'ibtikar-tech-frontend-rc.dev-sakhr.chatgpt.site/site/' templates/public_preview/pages
          grep -q 'homepageSkipLinks.slice(1)' static/public_preview/assets/js/page-shell.js

          service_pages=(
            store-launch.html storefront-customization.html store-redesign.html
            product-page-optimization.html ecommerce-growth.html ecommerce-support.html
          )
          for name in "${service_pages[@]}"; do
            page="templates/public_preview/pages/$name"
            grep -q 'class="service-detail-main"' "$page"
            grep -q 'class="service-commerce-hero"' "$page"
            grep -q 'class="service-quick-info"' "$page"
            grep -q 'data-service-decision-tabs' "$page"
            grep -q 'data-service-decision-tab="problems"' "$page"
            grep -q 'data-service-decision-panel="problems"' "$page"
            grep -q 'class="service-problem-grid"' "$page"
            grep -q 'class="service-fit-grid"' "$page"
            grep -q 'class="service-scope-grid"' "$page"
            grep -q 'class="service-deliverable-grid"' "$page"
            grep -q 'class="service-exclusion-list"' "$page"
            grep -q 'commerce-service-detail.js' "$page"
            ! grep -q 'class="svc-hero' "$page"
            ! grep -q 'data-decision-tab=' "$page"
          done

          for source in static/public_preview/dashboard/*.css; do
            filename="$(basename "$source")"
            target="static/public_preview/assets/css/pages/$filename"
            test -f "$target"
            cmp --silent "$source" "$target"
          done
          ! grep -q "/static/public_preview/dashboard/" static/public_preview/assets/js/page-shell.js
          grep -q "/static/public_preview/assets/css/pages/service-category-refinement-v1.css" static/public_preview/assets/js/page-shell.js
          grep -q "/static/public_preview/assets/css/pages/homepage-refinement-v1.css" static/public_preview/assets/js/page-shell.js
          grep -q "/static/public_preview/assets/css/pages/services-refinement-v1.css" static/public_preview/assets/js/page-shell.js
          grep -q "/static/public_preview/assets/css/pages/ecommerce-refinement-v1.css" static/public_preview/assets/js/page-shell.js
          grep -q "/static/public_preview/assets/css/pages/tharaa-refinement-v1.css" static/public_preview/assets/js/page-shell.js
