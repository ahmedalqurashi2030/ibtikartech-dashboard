name: Apply Related Service Cards Completeness Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/related-service-cards-completeness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/related-service-cards-completeness
          fetch-depth: 0

      - name: Apply narrowly scoped frontend and QA fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          js_path = Path('static/public_preview/assets/js/service-related-cards.js')
          js = js_path.read_text(encoding='utf-8')
          old = "document.querySelectorAll('.product-related-section .related-grid').forEach(replaceExistingRichGrid);"
          new = "document.querySelectorAll('.product-related-section .related-grid, .service-related-grid').forEach(replaceExistingRichGrid);"
          if new not in js:
              if old not in js:
                  raise SystemExit('Related-grid enhancement anchor changed; refusing unsafe edit.')
              js = js.replace(old, new, 1)
              js_path.write_text(js, encoding='utf-8')

          qa_path = Path('scripts/browser_qa_clean_urls.cjs')
          qa = qa_path.read_text(encoding='utf-8')

          routes_anchor = "const viewports = ["
          guard = """const relatedServiceRoutes = new Set([\n  '/websites/',\n  '/brand-content/',\n  '/growth/',\n  '/custom-systems/',\n  '/services/store-launch/',\n  '/services/storefront-customization/',\n  '/services/store-redesign/',\n  '/services/product-page-optimization/',\n  '/services/ecommerce-growth/',\n  '/services/ecommerce-support/',\n]);\n\n"""
          if 'const relatedServiceRoutes = new Set([' not in qa:
              if routes_anchor not in qa:
                  raise SystemExit('Browser QA routes anchor changed.')
              qa = qa.replace(routes_anchor, guard + routes_anchor, 1)

          old_metric = """      productRelatedHrefs: [...document.querySelectorAll('.related-grid article a[href]')]\n        .map((a) => a.getAttribute('href') || ''),"""
          new_metric = """      relatedServiceHrefs: [...document.querySelectorAll('.service-related-cards .service-related-card__link[href]')]\n        .map((a) => a.getAttribute('href') || ''),"""
          if new_metric not in qa:
              if old_metric not in qa:
                  raise SystemExit('Browser QA related-card metric anchor changed.')
              qa = qa.replace(old_metric, new_metric, 1)

          old_validation = """  if (route === '/services/product-page-optimization/') {\n    if (metrics.productRelatedHrefs.length !== 4) {\n      failures.push(`${prefix}: expected 4 related service cards, found ${metrics.productRelatedHrefs.length}`);\n    }\n    const legacyRelated = metrics.productRelatedHrefs.filter((href) => /\\\\.html(?:[?#]|$)/i.test(href));\n    if (legacyRelated.length) {\n      failures.push(`${prefix}: related cards expose .html URLs: ${legacyRelated.join(', ')}`);\n    }\n  }"""
          new_validation = """  if (relatedServiceRoutes.has(route)) {\n    if (metrics.relatedServiceHrefs.length < 2) {\n      failures.push(`${prefix}: expected related service cards, found ${metrics.relatedServiceHrefs.length}`);\n    }\n    const legacyRelated = metrics.relatedServiceHrefs.filter((href) => /\\\\.html(?:[?#]|$)/i.test(href));\n    if (legacyRelated.length) {\n      failures.push(`${prefix}: related cards expose .html URLs: ${legacyRelated.join(', ')}`);\n    }\n  }\n\n  if (route === '/services/product-page-optimization/' && metrics.relatedServiceHrefs.length !== 4) {\n    failures.push(`${prefix}: expected 4 related service cards, found ${metrics.relatedServiceHrefs.length}`);\n  }"""
          if new_validation not in qa:
              if old_validation not in qa:
                  raise SystemExit('Browser QA related-card validation anchor changed.')
              qa = qa.replace(old_validation, new_validation, 1)

          qa_path.write_text(qa, encoding='utf-8')
          PY

      - name: Validate exact scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check static/public_preview/assets/js/service-related-cards.js
          node --check scripts/browser_qa_clean_urls.cjs
          grep -Fq ".product-related-section .related-grid, .service-related-grid" static/public_preview/assets/js/service-related-cards.js
          grep -Fq "'/services/storefront-customization/'" scripts/browser_qa_clean_urls.cjs
          grep -Fq "relatedServiceHrefs" scripts/browser_qa_clean_urls.cjs
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "scripts/browser_qa_clean_urls.cjs" || test "${changed[1]}" = "scripts/browser_qa_clean_urls.cjs"
          test "${changed[0]}" = "static/public_preview/assets/js/service-related-cards.js" || test "${changed[1]}" = "static/public_preview/assets/js/service-related-cards.js"

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/browser_qa_clean_urls.cjs static/public_preview/assets/js/service-related-cards.js
          git commit -m 'fix: complete shared related service card coverage'
          git push origin HEAD:fix/related-service-cards-completeness
