name: P0 one-time services legacy cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_p0-clean-services-legacy.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production, ibtikartech]
    timeout-minutes: 5
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/p0-dashboard-services-legacy
          fetch-depth: 0

      - name: Remove retired services shell and runtime hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          template_path = Path('templates/public_preview/pages/services.html')
          html = template_path.read_text(encoding='utf-8')
          if html.count('data-approved-legacy-shell') != 3:
              raise SystemExit(f"Expected 3 retired services shell markers, found {html.count('data-approved-legacy-shell')}")

          header_pattern = re.compile(r'<header\b(?=[^>]*\bdata-approved-legacy-shell\b)[^>]*>.*?</header>\s*', re.I | re.S)
          html, header_count = header_pattern.subn('', html, count=1)
          if header_count != 1:
              raise SystemExit(f'Expected one retired services header, removed {header_count}')

          nav_pattern = re.compile(r'<nav\b(?=[^>]*\bdata-approved-legacy-shell\b)[^>]*>.*?</nav>\s*', re.I | re.S)
          html, nav_count = nav_pattern.subn('', html, count=1)
          if nav_count != 1:
              raise SystemExit(f'Expected one retired services mobile menu, removed {nav_count}')

          footer_pattern = re.compile(r'<footer\b(?=[^>]*\bdata-approved-legacy-shell\b)[^>]*>.*?</footer>\s*', re.I | re.S)
          html, footer_count = footer_pattern.subn('', html, count=1)
          if footer_count != 1:
              raise SystemExit(f'Expected one retired services footer, removed {footer_count}')

          legacy_skip = '<a class="skip" href="#main">انتقل إلى المحتوى</a>'
          if html.count(legacy_skip) != 1:
              raise SystemExit(f'Expected one retired services skip link, found {html.count(legacy_skip)}')
          html = html.replace(legacy_skip, '', 1)

          if 'data-approved-legacy-shell' in html:
              raise SystemExit('Retired services shell marker remains after cleanup')
          template_path.write_text(html, encoding='utf-8')

          runtime_path = Path('static/public_preview/assets/js/source-services.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          old = """  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const header = document.getElementById('header');\n  const bar = document.getElementById('progressBar');\n  let lastY = 0;\n\n  if (header || bar) {\n    addEventListener('scroll', () => {\n      const y = scrollY;\n      const max = document.documentElement.scrollHeight - innerHeight;\n      if (bar) bar.style.transform = `scaleX(${max > 0 ? y / max : 0})`;\n      if (header) header.classList.toggle('hide', y > lastY && y > 180);\n      lastY = y;\n    }, { passive: true });\n  }\n\n  const menuBtn = document.getElementById('menuBtn');\n  const mobileMenu = document.getElementById('mobileMenu');\n  if (menuBtn && mobileMenu) {\n    menuBtn.addEventListener('click', () => {\n      const open = mobileMenu.classList.toggle('open');\n      menuBtn.setAttribute('aria-expanded', String(open));\n    });\n    mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', () => {\n      mobileMenu.classList.remove('open');\n      menuBtn.setAttribute('aria-expanded', 'false');\n    }));\n  }\n"""
          new = """  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const bar = document.getElementById('progressBar');\n\n  if (bar) {\n    addEventListener('scroll', () => {\n      const max = document.documentElement.scrollHeight - innerHeight;\n      bar.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;\n    }, { passive: true });\n  }\n"""
          if runtime.count(old) != 1:
              raise SystemExit(f'Expected one retired header/menu runtime block, found {runtime.count(old)}')
          runtime = runtime.replace(old, new, 1)
          for marker in ("getElementById('header')", "getElementById('menuBtn')", "getElementById('mobileMenu')", 'lastY'):
              if marker in runtime:
                  raise SystemExit(f'Retired services runtime marker remains: {marker}')
          if "getElementById('progressBar')" not in runtime:
              raise SystemExit('Progress bar runtime was lost during cleanup')
          runtime_path.write_text(runtime, encoding='utf-8')
          PY

          node --check static/public_preview/assets/js/source-services.js
          ! grep -q 'data-approved-legacy-shell' templates/public_preview/pages/services.html
          ! grep -q "getElementById('header')" static/public_preview/assets/js/source-services.js
          ! grep -q "getElementById('mobileMenu')" static/public_preview/assets/js/source-services.js

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_p0-clean-services-legacy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/public_preview/pages/services.html static/public_preview/assets/js/source-services.js .github/workflows/_p0-clean-services-legacy.yml
          git diff --cached --check
          git commit -m "refactor: remove retired services shell runtime"
          git push origin HEAD:cleanup/p0-dashboard-services-legacy
