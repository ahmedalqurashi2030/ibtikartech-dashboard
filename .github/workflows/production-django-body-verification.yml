name: Production Django Body Verification

on:
  pull_request:
    paths:
      - ".github/workflows/production-django-body-verification.yml"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: [self-hosted, production, ibtikartech]
    timeout-minutes: 10
    steps:
      - name: Verify production services and health
        shell: bash
        run: |
          set -u
          service_state="$(systemctl is-active ibtikartech.service 2>&1 || true)"
          local_code="$(curl -sS -H 'X-Forwarded-Proto: https' -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/healthz/ 2>/tmp/ibtikar-local-curl.err || true)"
          public_code="$(curl -sS -o /dev/null -w '%{http_code}' https://ibtikartech.co/healthz/ 2>/tmp/ibtikar-public-curl.err || true)"

          echo "service_state=$service_state"
          echo "local_health=$local_code"
          echo "public_health=$public_code"
          if [ -s /tmp/ibtikar-local-curl.err ]; then cat /tmp/ibtikar-local-curl.err; fi
          if [ -s /tmp/ibtikar-public-curl.err ]; then cat /tmp/ibtikar-public-curl.err; fi

          test "$service_state" = "active"
          test "$local_code" = "200"
          test "$public_code" = "200"

      - name: Verify rendered shared shell and native body deployment markers
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ibtikartech.co"
          homepage="$(curl --fail --silent --show-error "$origin/")"
          services_html="$(curl --fail --silent --show-error "$origin/services/")"

          header_count="$(grep -o 'id="ibtikarSiteHeader"' <<<"$homepage" | wc -l || true)"
          footer_count="$(grep -o 'class="ibt-shell-footer"' <<<"$homepage" | wc -l || true)"
          layout_count="$(grep -o 'section-layout-refinement-v2.css' <<<"$homepage" | wc -l || true)"
          mega_count="$(grep -o 'data-ibt-mega-toggle' <<<"$homepage" | wc -l || true)"
          source_services_tag="$(grep -o '<script[^>]*source-services\.js[^>]*>' <<<"$services_html" | head -n1 || true)"
          approved_source_tag="$(grep -o '<script[^>]*approved-source\.js[^>]*>' <<<"$services_html" | head -n1 || true)"

          echo "header_count=$header_count"
          echo "footer_count=$footer_count"
          echo "layout_refinement_count=$layout_count (informational: later UI-only commit)"
          echo "mega_toggle_count=$mega_count"
          echo "source_services_tag=$source_services_tag"
          echo "approved_source_tag=$approved_source_tag"

          test "$header_count" -eq 1
          test "$footer_count" -eq 1
          test "$mega_count" -ge 1
          test -n "$source_services_tag"
          test -n "$approved_source_tag"
          grep -Fq 'defer' <<<"$source_services_tag"
          grep -Fq 'defer' <<<"$approved_source_tag"

      - name: Verify production clean routes and rendered content
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ibtikartech.co"
          routes=(
            / /services/ /ecommerce/ /websites/ /brand-content/ /growth/
            /custom-systems/ /tharaa/ /portfolio/ /knowledge/ /about/ /contact/
            /knowledge/store-launch/ /knowledge/product-page/ /knowledge/store-redesign/
            /services/store-launch/ /services/storefront-customization/
            /services/store-redesign/ /services/product-page-optimization/
            /services/ecommerce-growth/ /services/ecommerce-support/
          )

          for route in "${routes[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin$route")"
            test "$code" = "200" || { echo "$code $route"; exit 1; }
          done

          services_html="$(curl --fail --silent --show-error "$origin/services/")"
          grep -Fq 'ستة محاور رئيسية لبناء تجربة رقمية متكاملة' <<<"$services_html"
          ! grep -Fq 'سيتم نشر الخدمات قريبًا' <<<"$services_html"
          ! grep -Eqi '(href|action)="[^"]+\.html([?#][^"]*)?"' <<<"$services_html"

          for legacy in services.html portfolio.html about.html contact.html; do
            headers="$(curl -sSI "$origin/$legacy")"
            grep -Eq '^HTTP/[^ ]+ 301' <<<"$headers"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' <<<"$headers" | tail -n1)"
            test -n "$location"
            ! grep -q '\.html' <<<"$location"
          done

          for forbidden in /services/catalog/ /services/example-database-slug/; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin$forbidden")"
            test "$code" = "404" || { echo "$code $forbidden expected 404"; exit 1; }
          done

      - name: Verify architecture-critical production assets
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ibtikartech.co"
          assets=(
            /static/public_preview/assets/js/page-shell.js
            /static/public_preview/assets/js/ibtikar-shell.js
            /static/public_preview/dashboard/dom-contracts.js
            /static/public_preview/assets/css/ibtikar-shell.css
          )
          for asset in "${assets[@]}"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin$asset")"
            test "$code" = "200" || { echo "$code $asset"; exit 1; }
          done

          later_layout_code="$(curl -sS -o /dev/null -w '%{http_code}' "$origin/static/public_preview/assets/css/pages/section-layout-refinement-v2.css" || true)"
          echo "later_layout_refinement_asset=$later_layout_code (informational; not part of PR #32 architecture)"
