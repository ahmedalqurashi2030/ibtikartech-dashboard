name: Apply Native Body Contract Once

on:
  push:
    branches:
      - refactor/django-body-block-template-native-2026-08-20
    paths:
      - ".github/workflows/apply-native-body-contract-once.yml"

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/django-body-block-template-native-2026-08-20
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic Django template transformation
        run: |
          python -m py_compile scripts/refactor_public_preview_templates.py
          python -m py_compile scripts/verify_django_template_contract.py
          python scripts/refactor_public_preview_templates.py
          python scripts/normalize_public_preview_metadata.py
          python scripts/patch_public_runtime_accessibility.py
          python scripts/verify_django_template_contract.py

      - name: Commit transformed templates and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/public_preview/pages static/public_preview/assets/js/page-shell.js
          git rm .github/workflows/apply-native-body-contract-once.yml
          git commit -m "refactor: migrate public pages to native body block"
          git push origin HEAD:refactor/django-body-block-template-native-2026-08-20
