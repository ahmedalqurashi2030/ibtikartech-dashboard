name: Inline Public Sections Once

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/inline_public_sections_once.py
      - .github/workflows/inline-public-sections-once.yml
      - templates/public_preview/pages/**

permissions:
  contents: write

jobs:
  inline:
    if: github.head_ref == 'refactor/django-clean-urls-template-architecture-2026-08-20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inline section HTML into every page
        run: python scripts/inline_public_sections_once.py

      - name: Verify no page component includes remain
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n 'public_preview/components/' templates/public_preview/pages
          git diff --check

      - name: Commit normalized page templates
        shell: bash
        run: |
          if git diff --quiet -- templates/public_preview/pages; then
            echo "No page changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/public_preview/pages
          git commit -m "Inline repeated section HTML in public pages"
          git push origin HEAD:${{ github.head_ref }}
