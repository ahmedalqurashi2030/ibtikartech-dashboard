name: Production image delivery diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_production-image-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production, ibtikartech]
    timeout-minutes: 8
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4
        with:
          ref: fix/p0-final-foundation-qa

      - name: Diagnose repository, collected static files and nginx delivery
        shell: bash
        run: |
          set -euo pipefail
          echo '=== git image inventory ==='
          find static/public_preview/assets/images -type f | wc -l
          find static/public_preview/assets/images/hero -maxdepth 1 -type f -printf '%p %s bytes\n' | sort

          echo '=== production filesystem ==='
          for path in \
            /srv/ibtikartech/app/static/public_preview/assets/images \
            /srv/ibtikartech/app/static/public_preview/assets/images/hero \
            /srv/ibtikartech/app/staticfiles/public_preview/assets/images \
            /srv/ibtikartech/app/staticfiles/public_preview/assets/images/hero
          do
            if [ -e "$path" ]; then
              stat -c '%A %U:%G %n' "$path"
              find "$path" -maxdepth 1 -type f -printf '%f %s bytes\n' | head -n 20 || true
            else
              echo "MISSING $path"
            fi
          done

          echo '=== path traversal permissions ==='
          namei -l /srv/ibtikartech/app/staticfiles/public_preview/assets/images/hero/ibtikar-connected-ecosystem-v1.webp || true

          echo '=== nginx/http delivery ==='
          urls=(
            https://ibtikartech.co/static/public_preview/assets/css/ibtikar-shell.css
            https://ibtikartech.co/static/public_preview/assets/images/hero/ibtikar-connected-ecosystem-v1.webp
            https://ibtikartech.co/static/public_preview/assets/images/hero/ibtikar-ecommerce-journey-v1.jpg
            https://ibtikartech.co/static/public_preview/assets/images/hero/ibtikar-services-ecosystem-v1.jpg
          )
          for url in "${urls[@]}"; do
            printf '%s -> ' "$url"
            curl -L -sS -o /dev/null -w 'HTTP %{http_code} type=%{content_type} bytes=%{size_download}\n' "$url" || true
          done

          echo '=== referenced image assets missing from repository ==='
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = list(Path('templates/public_preview/pages').glob('*.html'))
          refs = set()
          for p in roots:
              text = p.read_text(encoding='utf-8')
              refs.update(re.findall(r'/static/public_preview/([^"\'\)\s>]+\.(?:png|jpe?g|webp|avif|svg))', text, re.I))
          missing=[]
          for ref in sorted(refs):
              path=Path('static/public_preview')/ref
              if not path.exists(): missing.append((ref, str(path)))
          print('referenced=', len(refs), 'missing=', len(missing))
          for item in missing: print('MISSING_REF', *item)
          PY
