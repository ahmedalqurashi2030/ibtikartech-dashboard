name: Temporary repository UI UX skill installer

on:
  push:
    branches:
      - chore/uiux-bootstrap-temp

permissions:
  contents: write

jobs:
  install-project-skill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/add-project-ui-ux-skill
          fetch-depth: 0

      - name: Confirm repository baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "branch=$(git branch --show-current)"
          echo "head=$(git rev-parse HEAD)"
          git status --short
          test "$(git rev-parse HEAD)" = "941e446862288bcf5afdfd99077658e277801b72"
          test ! -e .agents/skills/ui-ux-pro-max
          if git check-ignore -q .agents; then
            echo ".agents is ignored; refusing to continue" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify exact npm release
        shell: bash
        run: |
          set -euo pipefail
          npm view ui-ux-pro-max-cli@2.15.0 version repository license dist.tarball dist.integrity --json | tee /tmp/uiux-npm-metadata.json
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('/tmp/uiux-npm-metadata.json','utf8'));
          if (m.version !== '2.15.0') throw new Error(`Unexpected version: ${m.version}`);
          const repo = typeof m.repository === 'string' ? m.repository : (m.repository && m.repository.url) || '';
          if (!repo.includes('nextlevelbuilder/ui-ux-pro-max-skill')) throw new Error(`Unexpected repository: ${repo}`);
          if (m.license !== 'MIT') throw new Error(`Unexpected npm license metadata: ${m.license}`);
          if (!String(m['dist.tarball'] || '').includes('ui-ux-pro-max-cli-2.15.0.tgz')) throw new Error(`Unexpected tarball: ${m['dist.tarball']}`);
          if (!String(m['dist.integrity'] || '').startsWith('sha512-')) throw new Error('Missing SHA-512 dist.integrity');
          NODE

      - name: Generate Universal repository skill
        shell: bash
        run: |
          set -euo pipefail
          HOME="$RUNNER_TEMP/uiux-home" npm_config_cache="$RUNNER_TEMP/uiux-npm-cache" npx --yes ui-ux-pro-max-cli@2.15.0 init --ai universal
          test -d .agents/skills/ui-ux-pro-max
          keep="$RUNNER_TEMP/ui-ux-pro-max"
          mv .agents/skills/ui-ux-pro-max "$keep"
          rm -rf .agents
          mkdir -p .agents/skills
          mv "$keep" .agents/skills/ui-ux-pro-max

      - name: Add repository UI UX instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('AGENTS.md')
          text = path.read_text(encoding='utf-8')
          heading = '## Project UI/UX skill'
          if heading in text:
              raise SystemExit('Project UI/UX skill section already exists; refusing duplicate insertion')
          section = r'''

## Project UI/UX skill

- For every UI/UX design, implementation, review, or interface-fixing task, read `.agents/skills/ui-ux-pro-max/SKILL.md` in full before making UI decisions or edits.
- Use the skill's local search selectively for the domains or stack guidance that materially helps the task; do not run broad or unrelated searches by default.
- Treat the project's base UI context as Arabic RTL, responsive web, server-rendered Django Templates, and HTMX/lightweight JavaScript unless the repository code for the task shows otherwise.
- Do not assume React, Next.js, Tailwind CSS, or another framework. Detect and follow the stack actually used by the files being changed. The skill's `html-tailwind` corpus may be used only as the closest available HTML-oriented guidance when relevant; it does not authorize introducing Tailwind into this project.
- User instructions, project requirements, and this `AGENTS.md` take precedence over skill guidance when they conflict.
- Do not use the skill's `--persist` behavior unless the user explicitly asks to persist a generated design system.
- Prioritize UX clarity, accessibility, correct RTL behavior, mobile/responsive quality, performance, and conversion effectiveness over decorative novelty.
'''
          path.write_text(text.rstrip() + section + '\n', encoding='utf-8')
          PY

      - name: Validate skill structure and frontmatter
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          skill=.agents/skills/ui-ux-pro-max
          test -f "$skill/SKILL.md"
          test -f "$skill/scripts/search.py"
          test -f "$skill/scripts/core.py"
          test -f "$skill/scripts/design_system.py"
          test -f "$skill/scripts/reasoning_contract.py"
          test -d "$skill/data"
          test -d "$skill/data/stacks"
          test -f "$skill/data/stacks/html-tailwind.csv"
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('.agents/skills/ui-ux-pro-max/SKILL.md')
          text = p.read_text(encoding='utf-8')
          if not text.startswith('---\n'):
              raise SystemExit('SKILL.md is missing YAML frontmatter')
          try:
              frontmatter = text.split('---\n', 2)[1]
          except IndexError:
              raise SystemExit('SKILL.md frontmatter is not closed')
          fields = {}
          for line in frontmatter.splitlines():
              if not line.strip() or line[:1].isspace() or ':' not in line:
                  continue
              key, value = line.split(':', 1)
              fields[key.strip()] = value.strip()
          if set(fields) != {'name', 'description'}:
              raise SystemExit(f'Unexpected frontmatter keys: {sorted(fields)}')
          if fields['name'].strip('"\'') != 'ui-ux-pro-max':
              raise SystemExit(f"Unexpected skill name: {fields['name']}")
          name = fields['name'].strip('"\'')
          if not re.fullmatch(r'[a-z0-9]+(?:-[a-z0-9]+)*', name):
              raise SystemExit('Skill name is not lowercase hyphen-case')
          if not fields['description']:
              raise SystemExit('Skill description is empty')
          print('SKILL.md frontmatter: OK')
          PY
          if find "$skill" -type l -print -quit | grep -q .; then
            echo 'Symlink found inside skill' >&2
            find "$skill" -type l -print
            exit 1
          fi
          if find "$skill" \( -name node_modules -o -name __pycache__ -o -name '*.pyc' -o -name '*.tmp' -o -name '*.temp' \) -print -quit | grep -q .; then
            echo 'Unexpected cache/temp content before tests' >&2
            find "$skill" \( -name node_modules -o -name __pycache__ -o -name '*.pyc' -o -name '*.tmp' -o -name '*.temp' \) -print
            exit 1
          fi
          if grep -RIlE --exclude='*.csv' --exclude='*.md' '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' "$skill" | grep -q .; then
            echo 'Credential-like material detected in skill' >&2
            exit 1
          fi
          echo "file_count=$(find "$skill" -type f | wc -l)"
          echo "size_bytes=$(du -sb "$skill" | awk '{print $1}')"
          echo "stack_count=$(find "$skill/data/stacks" -maxdepth 1 -type f -name '*.csv' | wc -l)"

      - name: Run required lightweight searches
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "Arabic RTL service platform responsive accessibility" --domain ux | tee /tmp/uiux-search-ux.txt
          python3 .agents/skills/ui-ux-pro-max/scripts/search.py "Django templates responsive RTL interface" --stack html-tailwind | tee /tmp/uiux-search-stack.txt
          test -s /tmp/uiux-search-ux.txt
          test -s /tmp/uiux-search-stack.txt
          rm -rf .agents/skills/ui-ux-pro-max/scripts/__pycache__
          find .agents/skills/ui-ux-pro-max -type d -name __pycache__ -prune -exec rm -rf {} +
          find .agents/skills/ui-ux-pro-max -type f -name '*.pyc' -delete

      - name: Review final repository diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short --untracked-files=all
          git diff -- AGENTS.md
          python3 <<'PY'
          import subprocess
          rows = subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'], text=True).splitlines()
          paths = []
          for row in rows:
              p = row[3:]
              if ' -> ' in p:
                  p = p.split(' -> ', 1)[1]
              paths.append(p)
          bad = [p for p in paths if p != 'AGENTS.md' and not p.startswith('.agents/skills/ui-ux-pro-max/')]
          if bad:
              raise SystemExit('Unexpected changed paths: ' + ', '.join(bad))
          if 'AGENTS.md' not in paths:
              raise SystemExit('AGENTS.md was not updated')
          if not any(p.startswith('.agents/skills/ui-ux-pro-max/') for p in paths):
              raise SystemExit('Skill files are missing from status')
          print(f'Changed paths restricted correctly; {len(paths)} file paths reported')
          PY
          test -z "$(find .agents/skills/ui-ux-pro-max -type l -print -quit)"
          test -z "$(find .agents/skills/ui-ux-pro-max \( -name node_modules -o -name __pycache__ -o -name '*.pyc' -o -name '*.tmp' -o -name '*.temp' \) -print -quit)"
          echo "FINAL_FILE_COUNT=$(find .agents/skills/ui-ux-pro-max -type f | wc -l)"
          echo "FINAL_SIZE_BYTES=$(du -sb .agents/skills/ui-ux-pro-max | awk '{print $1}')"

      - name: Commit and push feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md .agents/skills/ui-ux-pro-max
          git diff --cached --check
          git commit -m 'chore: add repository-scoped UI UX Pro Max skill'
          git push origin HEAD:chore/add-project-ui-ux-skill
