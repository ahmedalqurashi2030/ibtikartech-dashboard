name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - self-hosted
      - production
      - ibtikartech
    timeout-minutes: 15
    concurrency:
      group: ibtikartech-ci-${{ github.ref }}
      cancel-in-progress: true

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: >-
          bash -n
          scripts/codespaces-bootstrap.sh
          scripts/codespaces-start.sh
          scripts/start-production.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create isolated test virtualenv
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/ibtikar-ci-venv"
          rm -rf "$venv"
          python -m venv "$venv"
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply committed migrations
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Ruff
        run: ruff check apps config tests --diff

      - name: Tests
        run: pytest

      - name: Verify model state
        run: python manage.py makemigrations --check --dry-run

      - name: Cleanup isolated test environment
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/ibtikar-ci-venv"

  deploy-production:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    runs-on:
      - self-hosted
      - production
      - ibtikartech

    timeout-minutes: 20

    concurrency:
      group: ibtikartech-production
      cancel-in-progress: false

    steps:
      - name: Deploy production
        run: sudo -u deploy -H /usr/local/sbin/deploy-ibtikartech

      - name: Ensure public image static permissions
        shell: bash
        run: |
          set -euo pipefail
          image_root=/srv/ibtikartech/app/staticfiles/public_preview/assets/images
          test -d "$image_root"
          # These are public static assets. Ensure nginx can traverse directories
          # and read files even when collectstatic creates new deploy-owned folders.
          sudo -u deploy -H chmod -R a+rX "$image_root"
          test -r "$image_root/hero/ibtikar-connected-ecosystem-v1.webp"
          test -r "$image_root/hero/ibtikar-ecommerce-journey-v1.jpg"
          test -r "$image_root/hero/ibtikar-services-ecosystem-v1.jpg"

      - name: Verify production health
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://ibtikartech.co/healthz/

      - name: Verify production image delivery
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            https://ibtikartech.co/static/public_preview/assets/images/hero/ibtikar-connected-ecosystem-v1.webp
            https://ibtikartech.co/static/public_preview/assets/images/hero/ibtikar-ecommerce-journey-v1.jpg
            https://ibtikartech.co/static/public_preview/assets/images/hero/ibtikar-services-ecosystem-v1.jpg
          )
          for url in "${urls[@]}"; do
            code="$(curl -L --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 2 --retry-all-errors "$url")"
            test "$code" = "200" || { echo "$url returned HTTP $code"; exit 1; }
          done
