name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: bash -n scripts/codespaces-bootstrap.sh scripts/codespaces-start.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Generate V1 migrations
        run: >-
          python manage.py makemigrations
          accounts core crm services sales customer_portal projects support
          marketing analytics content --noinput

      - name: Capture generated migrations
        uses: actions/upload-artifact@v4
        with:
          name: v1-migrations
          path: |
            apps/*/migrations/*.py
            !apps/*/migrations/__pycache__/**
          if-no-files-found: error
          retention-days: 3

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Ruff
        run: ruff check apps config tests --output-format=github

      - name: Tests
        run: pytest

      - name: Verify model state
        run: python manage.py makemigrations --check --dry-run
