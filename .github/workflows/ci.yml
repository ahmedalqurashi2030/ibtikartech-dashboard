name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: >-
          bash -n
          scripts/codespaces-bootstrap.sh
          scripts/codespaces-start.sh
          scripts/start-production.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply committed migrations
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Ruff
        run: ruff check apps config tests --output-format=github

      - name: Tests
        run: pytest

      - name: Verify model state
        run: python manage.py makemigrations --check --dry-run

  deploy-production:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.head_ref == 'codex/deploy-service-cinema-type-20260822')

    runs-on:
      - self-hosted
      - production
      - ibtikartech

    timeout-minutes: 20

    concurrency:
      group: ibtikartech-production
      cancel-in-progress: false

    steps:
      - name: Deploy production
        run: sudo -u deploy -H /usr/local/sbin/deploy-ibtikartech

      - name: Verify production health
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            https://ibtikartech.co/healthz/
