name: P0 one-time final foundation patch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_p0-final-foundation-audit.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, production, ibtikartech]
    timeout-minutes: 10
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@v4
        with:
          ref: fix/p0-final-foundation-qa
          fetch-depth: 0

      - name: Apply verified foundation cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_p0_final_foundation_patch.py
          git diff --check

      - name: Remove one-time patch files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_p0-final-foundation-audit.yml
          rm .github/workflows/_p0-final-foundation-patch.yml
          rm scripts/_p0_final_foundation_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize shared public foundation"
          git push origin HEAD:fix/p0-final-foundation-qa
