{% extends "wagtailadmin/base.html" %}
{% load static %}

{% block extra_css %}
  {{ block.super }}
  <link rel="stylesheet" href="{% static 'css/control/crm.css' %}">
{% endblock %}

{% block content %}
  <main class="ibt-control" id="main-content">
    {% if messages %}
      <div class="ibt-flashes" aria-live="polite">
        {% for message in messages %}<div class="ibt-flash">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block crm_content %}{% endblock %}
  </main>
{% endblock %}
