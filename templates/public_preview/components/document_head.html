<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Apply the progressive-enhancement state before page CSS is evaluated.
  // page-shell.js repeats this defensively for cached/imported documents.
  document.documentElement.classList.remove('no-js');
  document.documentElement.classList.add('js-ready');

  // P0 homepage shell stabilization: imported homepage markup still contains
  // retired, explicitly hidden navigation copies used by the preserved source.
  // Remove only those marked legacy nodes on source-home. Other pages keep
  // their current runtime contracts until they are audited independently.
  (() => {
    const legacySelector = '[data-approved-legacy-shell], .ibtx-legacy-mobile-menu';
    const onHomepage = () => document.body?.classList.contains('source-home') === true;
    const removeLegacyShell = (root) => {
      if (!onHomepage()) return;
      if (!(root instanceof Element || root instanceof Document)) return;
      if (root instanceof Element && root.matches(legacySelector)) {
        root.remove();
        return;
      }
      root.querySelectorAll?.(legacySelector).forEach((node) => node.remove());
    };

    const observer = new MutationObserver((records) => {
      records.forEach((record) => {
        record.addedNodes.forEach((node) => {
          if (node.nodeType === Node.ELEMENT_NODE) removeLegacyShell(node);
        });
      });
    });

    observer.observe(document.documentElement, { childList: true, subtree: true });
    document.addEventListener('DOMContentLoaded', () => {
      removeLegacyShell(document);
      observer.disconnect();
    }, { once: true });
  })();
</script>
