{{ runtime_config|json_script:"ibtikar-runtime-config" }}
<script>
  (() => {
    const node = document.getElementById('ibtikar-runtime-config');
    if (!node) return;
    try {
      window.IBTIKAR_CONFIG = JSON.parse(node.textContent);
    } catch (_) {
      window.IBTIKAR_CONFIG = {};
    }
  })();
</script>
<script>
  (() => {
    const deferredPairs = [
      ['launch-readiness.css', 'launch-readiness-deferred.css'],
    ];

    const loadDeferredStyles = () => {
      deferredPairs.forEach(([criticalName, deferredName]) => {
        const source = [...document.querySelectorAll('link[rel="stylesheet"][href]')]
          .find((link) => link.href.includes(`/assets/css/pages/${criticalName}`));
        if (!source) return;
        const deferredHref = source.href.replace(criticalName, deferredName);
        if (document.querySelector(`link[href="${deferredHref}"]`)) return;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = deferredHref;
        link.dataset.ibtDeferredStyle = deferredName;
        document.head.appendChild(link);
      });
    };

    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadDeferredStyles, { timeout: 900 });
    } else {
      window.setTimeout(loadDeferredStyles, 0);
    }
  })();
</script>
