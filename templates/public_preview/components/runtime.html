{{ runtime_config|json_script:"ibtikar-runtime-config" }}
<script>
  (() => {
    const node = document.getElementById('ibtikar-runtime-config');
    if (!node) return;
    try {
      window.IBTIKAR_CONFIG = JSON.parse(node.textContent);
    } catch (_) {
      window.IBTIKAR_CONFIG = {};
    }
  })();
</script>
<script>
  (() => {
    const deferredPairs = [
      ['launch-readiness.css', 'launch-readiness-deferred.css'],
      ['continuous-flow.css', 'continuous-flow-deferred.css'],
      ['section-layout-refinement-v2.css', 'section-layout-refinement-v2-deferred.css'],
      ['service-related-cards.css', 'service-related-cards-deferred.css'],
      ['service-cinema.css', 'service-cinema-deferred.css'],
      ['homepage-surface-refinement-v1.css', 'homepage-surface-refinement-v1-deferred.css'],
      ['home-experience-v2.css', 'home-experience-v2-deferred.css'],
      ['home-services-fix.css', 'home-services-fix-deferred.css'],
      ['conversion-funnel.css', 'conversion-funnel-deferred.css'],
    ];

    const stylesheetLinks = () => [...document.querySelectorAll('link[rel="stylesheet"][href]')];

    const loadDeferredStyles = () => {
      deferredPairs.forEach(([criticalName, deferredName]) => {
        const source = stylesheetLinks().find((link) => {
          try {
            return new URL(link.href, location.href).pathname.endsWith(`/${criticalName}`);
          } catch (_) {
            return false;
          }
        });
        if (!source) return;

        const deferredHref = source.href.replace(new RegExp(`${criticalName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}$`), deferredName);
        if (stylesheetLinks().some((link) => link.href === deferredHref)) return;

        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = deferredHref;
        link.dataset.ibtDeferredStyle = deferredName;
        document.head.appendChild(link);
      });
    };

    const scheduleDeferredStyles = () => {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadDeferredStyles, { timeout: 1200 });
      } else {
        window.setTimeout(loadDeferredStyles, 0);
      }
    };

    if (document.readyState === 'complete') {
      scheduleDeferredStyles();
    } else {
      window.addEventListener('load', scheduleDeferredStyles, { once: true });
    }
  })();
</script>
