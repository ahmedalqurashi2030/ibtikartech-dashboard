{% load static %}
<style data-ibt-critical>
@font-face{font-family:"IBM Plex Sans Arabic";src:url("{% static 'public_preview/assets/generated/6010e7fd0dce5d52.woff2' %}") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("{% static 'public_preview/assets/generated/90aef64fea9794f2.woff2' %}") format("woff2");font-style:normal;font-weight:500;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("{% static 'public_preview/assets/generated/16734a5adb27b0f3.woff2' %}") format("woff2");font-style:normal;font-weight:600;font-display:swap}
@font-face{font-family:"IBM Plex Sans Arabic";src:url("{% static 'public_preview/assets/generated/04c730b4292731cc.woff2' %}") format("woff2");font-style:normal;font-weight:700 900;font-display:swap}

html{max-width:100%;overflow-x:clip}
body{max-width:100%;overflow-x:clip;font-synthesis:none;font-kerning:normal;text-rendering:optimizeLegibility}
main p{max-width:68ch}
img{height:auto}

/* Keep the homepage first paint on the approved dark canvas. */
body.source-home .announcement,
body.source-home .ibtx-announcement{display:none!important}
body.source-home{--announcement-h:0px!important}
body.source-home,
body.source-home main,
body.source-home .cinematic-ambient-bg{background-color:#050817!important}

/* Above-fold geometry extracted from the full launch layer. */
.inner-page:not(.approved-source-page) .platform-hero{min-height:auto;padding:clamp(142px,14vw,190px) 0 clamp(72px,8vw,104px)}
.inner-page:not(.approved-source-page) .platform-hero h1{font-size:clamp(42px,5.4vw,70px);line-height:1.14}
.service-detail-page .service-commerce-hero{padding-top:clamp(122px,11vw,154px)}
.service-detail-page .service-commerce-hero__card{min-height:0;padding:clamp(28px,4vw,48px)}
.service-detail-page .service-commerce-copy h1{font-size:clamp(38px,4.5vw,64px);line-height:1.16;text-wrap:balance}
body.source-home .hero__content h1{font-size:clamp(48px,6.6vw,86px);line-height:1.08;text-wrap:balance}
body.source-home .hero__content>p{max-width:65ch;font-size:clamp(16px,1.35vw,19px);line-height:1.9}
body.source-tharaa .hero{min-height:760px;padding-top:clamp(138px,12vw,176px)}
body.source-tharaa .hero h1{font-size:clamp(76px,10vw,132px);line-height:.92}
body.source-tharaa .hero-lead{max-width:62ch;font-size:clamp(16px,1.3vw,19px)}
body.source-product-service .service-page{padding-top:98px}
body.source-product-service .svc-hero{min-height:560px;padding:clamp(30px,4vw,48px)}
body.source-product-service .svc-hero h1{font-size:clamp(38px,4.3vw,64px);line-height:1.16;text-wrap:balance}

/* Homepage ecosystem: retain the first-view art direction while the broader
   conversion layer is delivered after the load event. */
.hero--system .hero__grid{grid-template-columns:minmax(0,.93fr) minmax(440px,1.07fr);gap:clamp(42px,6vw,88px)}
.hero--system .hero__content{position:relative;z-index:2}
.hero-ecosystem{position:relative;margin:0;min-width:0;isolation:isolate}
.hero-ecosystem::before{content:"";position:absolute;inset:13% 7%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(69,139,255,.24),rgba(117,71,239,.11) 48%,transparent 72%);filter:blur(30px)}
.hero-ecosystem img{display:block;width:min(100%,680px);height:auto;margin-inline:auto;filter:drop-shadow(0 34px 56px rgba(0,0,0,.3));animation:ecosystem-float 7s ease-in-out infinite}
.hero-ecosystem figcaption{width:max-content;max-width:90%;margin:-4px auto 0;padding:9px 14px;border:1px solid rgba(255,255,255,.1);border-radius:999px;color:#aeb9d5;background:rgba(8,14,38,.66);backdrop-filter:blur(12px);font-size:12px;text-align:center}
@keyframes ecosystem-float{50%{transform:translateY(-9px)}}

/* Services hero image is the mobile/desktop LCP candidate. Its geometry must
   be stable before the deferred conversion stylesheet arrives. */
.source-services .hero-visual--image{position:relative;display:grid;place-items:center;margin:0;min-height:520px}
.source-services .hero-visual--image::before{content:"";position:absolute;inset:12%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(57,189,248,.2),rgba(126,74,239,.13) 50%,transparent 72%);filter:blur(30px)}
.source-services .hero-visual--image img{display:block;width:min(100%,680px);height:auto;border-radius:30px;box-shadow:0 36px 84px rgba(0,0,0,.34)}
.source-services .hero-visual--image figcaption{margin-top:-22px;padding:10px 16px;border:1px solid rgba(255,255,255,.11);border-radius:999px;color:#b8c2d9;background:rgba(6,12,32,.8);backdrop-filter:blur(14px);font-size:12px}

/* Tharaa's price/decision panel is part of the first screen and remains
   visually complete before the rest of the product-story CSS is requested. */
.tharaa-decision{margin-top:26px;padding:22px;border:1px solid rgba(255,255,255,.13);border-radius:22px;background:rgba(7,9,20,.72);backdrop-filter:blur(16px)}
.tharaa-decision__price{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}
.tharaa-decision__price strong{font-size:clamp(32px,4vw,48px)}
.tharaa-decision__price del{color:#8e98b3}
.tharaa-decision__price small{color:#aeb9d5}
.tharaa-decision__actions{display:flex;flex-wrap:wrap;gap:10px}
.tharaa-decision__note{display:block;margin-top:12px;color:#aeb9d5;font-size:13px}

/* Shared phone action pairs are tiny and first-view critical. */
@media(max-width:760px){
  .inner-page:not(.approved-source-page) .platform-hero{padding:118px 0 58px}
  .inner-page:not(.approved-source-page) .platform-hero h1{font-size:clamp(36px,10.5vw,48px)}
  .service-detail-page .service-commerce-hero{padding-top:104px}
  .service-detail-page .service-commerce-hero__card{padding:22px 18px;border-radius:24px}
  .service-detail-page .service-commerce-copy h1{font-size:clamp(34px,9.5vw,45px)}
  body.source-home .hero__content h1{font-size:clamp(43px,13vw,58px)}
  body.source-tharaa .hero{min-height:auto;padding-top:118px}
  body.source-tharaa .hero h1{font-size:clamp(70px,23vw,94px)}
  body.source-product-service .service-page{padding-top:88px}
  body.source-product-service .svc-hero{min-height:auto;padding:22px 18px}
  body.source-product-service .svc-hero h1{font-size:clamp(34px,9vw,46px)}

  .hero--system .hero__grid{grid-template-columns:1fr;gap:30px}
  .hero--system .hero__content{text-align:center}
  .hero--system .hero__content>p{margin-inline:auto}
  .hero--system .hero__actions{justify-content:center}
  .hero-ecosystem{order:2;width:min(100%,540px);margin-inline:auto}
  .hero-ecosystem img{width:100%}
  .hero-ecosystem figcaption{margin-top:-10px}
  .source-services .hero-visual--image{min-height:0}
  .source-services .hero-visual--image img{border-radius:22px}
  .tharaa-decision__actions>*{width:100%;justify-content:center}

  :is(.hero__actions,.cta-actions,.tharaa-actions,.ibtx-tharaa-split__actions,.platform-actions,.service-commerce-actions,.service-detail-actions,.service-hero-actions,.commerce-hero__actions,.contact-actions,.page-actions){display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;gap:8px!important;width:100%}
  :is(.hero__actions,.cta-actions,.tharaa-actions,.ibtx-tharaa-split__actions,.platform-actions,.service-commerce-actions,.service-detail-actions,.service-hero-actions,.commerce-hero__actions,.contact-actions,.page-actions)>:is(a,button,.btn,.button){flex:1 1 0!important;width:auto!important;min-width:0!important;max-width:none!important;min-height:44px;padding-inline:clamp(10px,3.2vw,15px)!important;text-align:center;justify-content:center;white-space:normal!important;line-height:1.35;font-size:clamp(11px,3.25vw,13px)}
  .service-commerce-actions>.service-text-link{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding-inline:10px!important;text-align:center}
}
/* LCP content must be paintable immediately on compact viewports. */
@media(max-width:760px){
  body.source-home #home .hero__content.reveal,
  body.source-home #home .hero-ecosystem.reveal,
  body.source-services #top .reveal,
  .articles-hero .reveal,
  .platform-hero .reveal{opacity:1!important;transform:none!important}
}
@media(max-width:360px){
  :is(.hero__actions,.cta-actions,.tharaa-actions,.ibtx-tharaa-split__actions,.platform-actions,.service-commerce-actions,.service-detail-actions,.service-hero-actions,.commerce-hero__actions,.contact-actions,.page-actions){gap:6px!important}
  :is(.hero__actions,.cta-actions,.tharaa-actions,.ibtx-tharaa-split__actions,.platform-actions,.service-commerce-actions,.service-detail-actions,.service-hero-actions,.commerce-hero__actions,.contact-actions,.page-actions)>:is(a,button,.btn,.button){padding-inline:8px!important;font-size:11px!important}
}
@media(prefers-reduced-motion:reduce){.hero-ecosystem img{animation:none}}
</style>
