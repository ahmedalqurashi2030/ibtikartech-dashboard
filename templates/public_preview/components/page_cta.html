<section class="page-cta">
  <div class="container">
    <div class="cta-card reveal">
      <div>
        <span class="section-kicker">{{ kicker }}</span>
        <h2>{{ title|safe }}</h2>
        <p>{{ description|safe }}</p>
      </div>
      <div class="cta-actions">
        <a class="{{ primary_class }}" href="{% url primary_url_name %}{{ primary_fragment|default:'' }}">{{ primary_label }}</a>
        {% if secondary_url_name %}
          <a class="{{ secondary_class }}" href="{% url secondary_url_name %}{{ secondary_fragment|default:'' }}">{{ secondary_label }}</a>
        {% endif %}
      </div>
    </div>
  </div>
</section>
